<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palavra de Fé Diária</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <div class="card">
        <h1>Palavra de Fé Diária</h1>
        <div class="verse-box">
            <p id="texto">"Clique abaixo para meditar em um versículo aleatório."</p>
            <span id="referencia">---</span>
        </div>
        
        <!-- CONTAINER 100% DE LARGURA COM OS DOIS BOTÕES LADO A LADO -->
        <div style="display: flex; gap: 10px; width: 100%; margin-top: 20px; box-sizing: border-box;">
            
            <!-- Botão Principal -->
            <button onclick="gerarVersiculoSemRepetir()" style="flex: 1; padding: 12px 0; font-weight: bold; cursor: pointer; border-radius: 4px; border: none; white-space: nowrap;">
                <span class="dice-icon">🎲</span> Receber Palavra
            </button>

            <!-- Botão do WhatsApp (Configurado para copiar o texto direto e burlar o bloqueio) -->
            <button id="btn-whatsapp" style="flex: 1; background-color: #25D366; color: white; border: none; padding: 12px 0; border-radius: 4px; font-weight: bold; font-family: sans-serif; font-size: 13px; cursor: pointer; white-space: nowrap; box-sizing: border-box;">
                <span>📋</span> Copiar p/ WhatsApp
            </button>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
